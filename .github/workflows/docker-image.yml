name: CI/CD Docker GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_REGISTRY: ${{ secrets.DOCKER_ACCOUNT }}

jobs:

  tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout
        uses: actions/checkout@v5
  
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
  
      - name: Restore
        run: dotnet restore
  
      - name: Build solution
        run: dotnet build --no-restore
  
      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        
      - name: Afficher l'arborescence
        run: |
         pwd
         ls -la
         find . -iname DockerFile
    
      #################################################
      # AuthentificationApi
      #################################################

      - name: Build AuthentificationApi
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/authentificationapi:latest -f AuthentificationApi/DockerFile .

      - name: Push AuthentificationApi
        run: docker push ${{ env.DOCKER_REGISTRY }}/authentificationapi:latest

      #################################################
      # GestionOrdinateursAPI
      #################################################
      - name: Build GestionOrdinateursAPI
        run : docker build -t ${{env.DOCKER_REGISTRY}}/gestionordinateursapi:latest -f GestionOrdinateurs.API/DockerFile .
      
      - name: Push GestionOrdinateursAPI
        run: docker push ${{env.DOCKER_REGISTRY}}/gestionordinateursapi:latest

      #################################################
      # GestionOrdinateursGateway
      #################################################
      
      - name: Build GestionOrdinateursGateway
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/gestionordinateursgateway:latest -f GestionOrdinateurs.Gateway/DockerFile .

      - name: Push GestionOrdinateursGateway
        run: docker push ${{ env.DOCKER_REGISTRY }}/gestionordinateursgateway:latest

      #################################################
      # GestionOrdinateursClient
      #################################################

      - name: Build GestionOrdinateursClient
        run: docker build -t ${{ env.DOCKER_REGISTRY }}/gestionordinateursclient:latest -f GestionOrdinateurs.Client/DockerFile .

      - name: Push GestionOrdinateursClient
        run: docker push ${{ env.DOCKER_REGISTRY }}/gestionordinateursclient:latest
